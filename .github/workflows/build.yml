name: build
on: [pull_request, push]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        java: [21]                # 改为你项目使用的 Java 版本，如 17 或 21
        os: [ubuntu-latest, windows-latest, macos-latest]  # 可保留，也可只留 ubuntu
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4    # 升级到 v4
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4   # 新方式
      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v4  # 升级到 v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'microsoft'
      - name: Make Gradle wrapper executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew
      - name: Build
        run: ./gradlew build
      # GameTest 相关步骤已完全移除
      - name: Capture build artifacts
        if: ${{ runner.os == 'Linux' }}   # 可选：只在 Linux 上上传产物
        uses: actions/upload-artifact@v4  # 升级到 v4
        with:
          name: Artifacts
          path: build/libs/