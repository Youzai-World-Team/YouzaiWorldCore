plugins {
    id 'net.fabricmc.fabric-loom' version '1.16-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    accessWidenerPath = file("src/client/resources/youzaiworldcore.client.accesswidener")

    mods {
        "youzaiworldcore" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    mavenCentral()
    mavenLocal()
    maven {
        url = 'https://maven.nucleoid.xyz/'
        content {
            includeGroup('eu.pb4')
        }
    }
    maven {
        url = 'https://maven.lucko.me/'
        content {
            includeGroup('net.luckperms')
        }
    }
    // TerraformersMC Maven（ModMenu）
    maven {
    name = "Terraformers"
    url = "https://maven.terraformersmc.com/"
    content {
            includeGroup('com.terraformersmc')
        }
  }

    // Modrinth Maven（Moog's Structure Lib）
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup("maven.modrinth")
        }
    }

    // GeckoLib Maven（Cloudsmith，官方文档指定写法）
    exclusiveContent {
        forRepository {
            maven {
                name = 'GeckoLib'
                url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            }
        }
        filter {
            includeGroupAndSubgroups('com.geckolib')
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Placeholder API
    implementation('eu.pb4:placeholder-api:3.1.0-beta.1+26.2')

    // Permissions API
    include(implementation('me.lucko:fabric-permissions-api:0.6.1'))

    // LuckPerms API
    compileOnly "net.luckperms:api:${project.luckperms_version}"

    // ModMenu
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

    // Moog's Structure Lib
    implementation "maven.modrinth:moogs-structure-lib:3.0.4"

    // Trinkets API
    implementation "eu.pb4:trinkets:4.1.0-beta.2+26.2"

    // GeckoLib（老吴对峙态猫模型/动画）
    // 文档写的是 modImplementation，但 Loom 1.16.3 已移除 mod* 配置（26.x 起不再需要重映射），
    // 故与本文件其它 mod 依赖一致用 implementation。
    implementation "com.geckolib:geckolib-fabric-${project.minecraft_version}:${project.geckolib_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    repositories {
    }
}